name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Apple Silicon, like the target machine; ships Apple's built-in AUs
    # (AULowpass, AUDelay) that the integration tests host.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --quiet pytest
          brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build tests and plugins
        run: cmake --build build --target ClaudeHostTests ClaudeHostFX_All

      - name: Unit, integration and client tests
        run: ctest --test-dir build -LE validation --output-on-failure

      # The FabFilter tests are hidden ([.]) and need the user's plugins,
      # so they only run locally.
      - name: Plugin validation (auval + pluginval)
        run: ctest --test-dir build -L validation --output-on-failure

      - name: Keep validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: build/*.log
          if-no-files-found: ignore
