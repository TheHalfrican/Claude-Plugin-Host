name: Tests

# Runs on both forges:
#   - GitHub (via the Gitea push mirror): a clean macOS VM; full job,
#     including installing the plugins and validating them.
#   - Gitea: the user's own Mac runner ("macos-latest", host mode), so
#     jobs run directly on the user's Mac. There, only build and run the
#     tests. Building the plugins would install them into
#     ~/Library/Audio/Plug-Ins and replace the copy Live uses.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest   # Apple Silicon on GitHub; the user's Mac on Gitea
    timeout-minutes: 45

    env:
      ON_GITEA: ${{ github.server_url != 'https://github.com' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python (GitHub)
        if: env.ON_GITEA != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python3 -m pytest --version >/dev/null 2>&1 || python3 -m pip install --quiet pytest
          command -v ninja >/dev/null || brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build tests
        run: cmake --build build --target ClaudeHostTests

      - name: Unit, integration and client tests
        run: ctest --test-dir build -LE validation --output-on-failure

      # GitHub only: building the plugins installs them (see top of file).
      # The FabFilter tests are hidden ([.]) and need the user's plugins,
      # so they only run by hand.
      - name: Build plugins (GitHub)
        if: env.ON_GITEA != 'true'
        run: cmake --build build --target ClaudeHostFX_All

      - name: Plugin validation, auval + pluginval (GitHub)
        if: env.ON_GITEA != 'true'
        run: ctest --test-dir build -L validation --output-on-failure

      - name: Keep validation logs (GitHub)
        if: always() && env.ON_GITEA != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: validation-logs
          path: build/*.log
          if-no-files-found: ignore
